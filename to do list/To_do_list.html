<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>High Graphics To‑Do List with Categories</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg: #0f1723;
      --glass: rgba(255,255,255,0.05);
      --border: rgba(255,255,255,0.08);
      --accent: #00ffd5;
      --accent2: #ff6ec7;
    }
    *{box-sizing:border-box;margin:0;padding:0;font-family:Inter,system-ui,Segoe UI,Roboto,"Helvetica Neue",Arial}
    body{background: radial-gradient(800px 500px at 20% 20%, rgba(0,255,213,0.05), transparent), radial-gradient(600px 400px at 80% 80%, rgba(255,110,199,0.05), transparent), var(--bg);color:#f0f6ff;display:flex;align-items:center;justify-content:center;height:100vh;padding:20px}

    .app{width:500px;max-width:100%;background:linear-gradient(180deg,rgba(255,255,255,0.02),rgba(0,0,0,0.1));padding:28px;border-radius:20px;box-shadow:0 12px 40px rgba(0,0,0,0.7);border:1px solid var(--border);backdrop-filter:blur(8px)}

    h1{font-size:22px;margin-bottom:18px;display:flex;align-items:center;gap:10px;font-weight:800}
    h1 span{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;color:#041f1f;font-weight:800;font-size:18px;box-shadow:0 6px 18px rgba(0,0,0,0.6)}

    .inputRow{display:flex;gap:10px;margin-bottom:20px}
    .inputRow input, .inputRow select{flex:1;padding:12px 14px;border-radius:12px;border:1px solid var(--border);background:rgba(255,255,255,0.02);color:#fff;font-size:14px}
    .inputRow button{padding:12px 18px;border:none;border-radius:12px;background:linear-gradient(135deg,var(--accent),var(--accent2));font-weight:600;color:#041f1f;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,0.5);transition:transform .12s}
    .inputRow button:hover{transform:translateY(-2px)}

    ul{list-style:none;display:flex;flex-direction:column;gap:10px;max-height:380px;overflow-y:auto;padding-right:6px}
    li{background:rgba(255,255,255,0.02);padding:14px 16px;border-radius:12px;display:flex;justify-content:space-between;align-items:center;border:1px solid var(--border);box-shadow:0 4px 16px rgba(0,0,0,0.5);transition:background .2s}
    li.done{background:rgba(0,255,213,0.08);text-decoration:line-through;color:rgba(240,246,255,0.6)}
    li span{flex:1}
    li .category{font-size:11px;color:rgba(255,255,255,0.5);margin-left:6px;padding:2px 6px;border-radius:6px;border:1px solid rgba(255,255,255,0.1)}

    .actions{display:flex;gap:8px}
    .btn{background:transparent;border:1px solid var(--border);padding:6px 10px;border-radius:8px;color:inherit;cursor:pointer;font-size:12px;transition:background .2s}
    .btn:hover{background:rgba(255,255,255,0.05)}

    /* Scrollbar */
    ul::-webkit-scrollbar{width:6px}
    ul::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.15);border-radius:3px}

    .footer{margin-top:18px;font-size:12px;color:rgba(240,246,255,0.6);text-align:center}
  </style>
</head>
<body>
  <div class="app">
    <h1><span>✓</span> To‑Do List</h1>
    <div class="inputRow">
      <input type="text" id="taskInput" placeholder="Enter a new task...">
      <select id="categorySelect">
        <option value="General">General</option>
        <option value="Work">Work</option>
        <option value="Personal">Personal</option>
        <option value="Urgent">Urgent</option>
      </select>
      <button id="addBtn">Add</button>
    </div>
    <ul id="taskList"></ul>
    <div class="footer">Click a task to toggle complete. Data is saved in your browser.</div>
  </div>

  <script>
    const taskInput = document.getElementById('taskInput');
    const addBtn = document.getElementById('addBtn');
    const taskList = document.getElementById('taskList');
    const categorySelect = document.getElementById('categorySelect');

    let tasks = JSON.parse(localStorage.getItem('tasks')||'[]');

    function save(){localStorage.setItem('tasks', JSON.stringify(tasks));}

    function render(){
      taskList.innerHTML='';
      tasks.forEach((t,i)=>{
        const li=document.createElement('li');
        if(t.done) li.classList.add('done');
        const span=document.createElement('span');
        span.textContent=t.text;
        const catSpan = document.createElement('span');
        catSpan.className='category'; catSpan.textContent=t.category;
        span.appendChild(catSpan);
        span.addEventListener('click',()=>{tasks[i].done=!tasks[i].done;save();render();});
        const actions=document.createElement('div');actions.className='actions';
        const del=document.createElement('button');del.textContent='Delete';del.className='btn';del.addEventListener('click',()=>{tasks.splice(i,1);save();render();});
        actions.appendChild(del);
        li.appendChild(span);li.appendChild(actions);
        taskList.appendChild(li);
      });
    }

    addBtn.addEventListener('click',()=>{
      const text=taskInput.value.trim();
      const category=categorySelect.value;
      if(!text) return;
      tasks.push({text,category,done:false});save();render();taskInput.value='';taskInput.focus();
    });

    taskInput.addEventListener('keypress',(e)=>{if(e.key==='Enter') addBtn.click();});

    render();
  </script>
</body>
</html>

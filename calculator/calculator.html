<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Simple Neon Calculator</title>
  <style>
    body{
      margin:0; display:grid; place-items:center; height:100vh;
      background: radial-gradient(circle at top left, #0f2027, #203a43, #2c5364);
      font-family:sans-serif;
    }
    .calc{
      width:320px; border-radius:20px; padding:20px;
      background:rgba(255,255,255,0.1);
      box-shadow:0 8px 25px rgba(0,0,0,0.4),0 0 20px rgba(0,255,255,0.4);
      backdrop-filter:blur(10px);
    }
    .display{
      background:rgba(0,0,0,0.6); color:#0ff;
      border-radius:12px; padding:15px; text-align:right;
      font-size:28px; margin-bottom:15px; min-height:40px;
      box-shadow: inset 0 0 10px rgba(0,255,255,0.5);
    }
    .grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:10px; }
    button{
      height:60px; border:none; border-radius:12px; font-size:20px; font-weight:bold;
      background:rgba(255,255,255,0.15); color:#fff; cursor:pointer;
      box-shadow:0 4px 10px rgba(0,0,0,0.4),0 0 10px rgba(0,255,255,0.3);
      transition:transform 0.1s;
    }
    button:active{ transform:scale(0.95); }
    .op{ color:#0ff; }
    .equal{ grid-column: span 2; background:#0ff; color:#000; }
    .clear{ background:#f55; }
  </style>
</head>
<body>
  <div class="calc">
    <div id="display" class="display">0</div>
    <div class="grid">
      <button class="clear" data-key="C">C</button>
      <button class="op" data-key="%">%</button>
      <button class="op" data-key="/">÷</button>
      <button class="op" data-key="*">×</button>

      <button data-key="7">7</button>
      <button data-key="8">8</button>
      <button data-key="9">9</button>
      <button class="op" data-key="-">−</button>

      <button data-key="4">4</button>
      <button data-key="5">5</button>
      <button data-key="6">6</button>
      <button class="op" data-key="+">+</button>

      <button data-key="1">1</button>
      <button data-key="2">2</button>
      <button data-key="3">3</button>
      <button class="equal" data-key="=">=</button>

      <button style="grid-column:span 2" data-key="0">0</button>
      <button data-key=".">.</button>
    </div>
  </div>

  <script>
    const display = document.getElementById('display');
    let expression = '';

    document.querySelectorAll('button').forEach(btn =>{
      btn.addEventListener('click', ()=>{
        const k = btn.dataset.key;
        if(k==='C'){
          expression='';
          display.textContent='0';
        }else if(k==='='){
          try{
            const val = eval(expression);
            display.textContent = val;
            expression = val.toString();
          }catch{
            display.textContent = 'Error';
            expression='';
          }
        }else{
          expression += k;
          display.textContent = expression;
        }
      });
    });
  </script>
</body>
</html>

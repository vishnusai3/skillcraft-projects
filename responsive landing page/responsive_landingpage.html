<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responsive Landing Page</title>
  <style>
    /* Reset */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      line-height: 1.6;
    }

    /* Navbar */
    nav {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      background: transparent;
      padding: 15px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: 0.3s;
      z-index: 1000;
    }

    nav.scrolled {
      background: #333;
      color: #fff;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }

    nav .logo {
      font-size: 22px;
      font-weight: bold;
    }

    nav ul {
      list-style: none;
      display: flex;
    }

    nav ul li {
      margin-left: 20px;
    }

    nav ul li a {
      text-decoration: none;
      color: #000;
      font-size: 18px;
      transition: color 0.3s;
    }

    nav.scrolled ul li a {
      color: #fff;
    }

    nav ul li a:hover {
      color: #ff6600;
    }

    /* Hero Section */
    .hero {
      height: 100vh;
      background: url('https://picsum.photos/1600/900') no-repeat center center/cover;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      color: white;
    }

    .hero h1 {
      font-size: 50px;
      background: rgba(0,0,0,0.6);
      padding: 20px;
      border-radius: 10px;
    }

    /* Content Sections */
    section {
      padding: 100px 20px;
      text-align: center;
    }

    /* Responsive */
    @media (max-width: 768px) {
      nav ul {
        flex-direction: column;
        background: #333;
        position: absolute;
        top: 60px;
        right: 0;
        width: 200px;
        display: none;
      }
      nav ul.show {
        display: block;
      }
      nav ul li {
        margin: 15px 0;
      }
      nav .menu-toggle {
        display: block;
        cursor: pointer;
      }
    }

    .menu-toggle {
      display: none;
      font-size: 24px;
    }
  </style>
</head>
<body>

  <!-- Navigation -->
  <nav id="navbar">
    <div class="logo">MyLandingPage</div>
    <span class="menu-toggle" id="menu-toggle">☰</span>
    <ul id="menu">
      <li><a href="#home">Home</a></li>
      <li><a href="#about">About</a></li>
      <li><a href="#services">Services</a></li>
      <li><a href="#contact">Contact</a></li>
    </ul>
  </nav>

  <!-- Hero Section -->
  <div class="hero" id="home">
    <h1>Welcome to My Landing Page</h1>
  </div>

  <!-- About Section -->
  <section id="about">
    <h2>About Us</h2>
    <p>This is a responsive landing page with an interactive navigation menu.</p>
  </section>

  <!-- Services Section -->
  <section id="services">
    <h2>Services</h2>
    <p>We provide high-quality web solutions and interactive designs.</p>
  </section>

  <!-- Contact Section -->
  <section id="contact">
    <h2>Contact</h2>
    <p>Get in touch with us at contact@example.com</p>
  </section>

  <script>
    // Change navbar color on scroll
    window.addEventListener("scroll", function() {
      let navbar = document.getElementById("navbar");
      navbar.classList.toggle("scrolled", window.scrollY > 50);
    });

    // Mobile menu toggle
    const menuToggle = document.getElementById("menu-toggle");
    const menu = document.getElementById("menu");

    menuToggle.addEventListener("click", () => {
      menu.classList.toggle("show");
    });
  </script>

</body>
</html>
